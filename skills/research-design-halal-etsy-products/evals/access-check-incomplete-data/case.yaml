schema_version: "1.1"
name: access-check-incomplete-data
expected_outcome: |
  The response first records which Etsy sources (search, listing pages, reviews, Etsy Help)
  were reachable. If listing pages or reviews could not be retrieved, it gives no ranking
  based on purchase evidence and says purchase evidence was not collected. It treats the
  eRank figures as estimates with unknown geography and period, does not rank the halal
  budget spreadsheet on the broad "budget spreadsheet" keyword, keeps halal status separate
  from unverified Etsy eligibility, and lists the specific data the user should supply.
